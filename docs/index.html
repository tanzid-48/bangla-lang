<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>বাংলা-ল্যাং</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0e1a;--surface:#111827;--surface2:#1f2937;--border:#2d3748;--green:#10b981;--text:#f1f5f9;--text-dim:#94a3b8;--red:#ef4444;--blue:#60a5fa}
    html{scroll-behavior:smooth}
    body{font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

    /* HERO */
    .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;width:700px;height:700px;background:radial-gradient(circle,rgba(16,185,129,.13) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
    .hero-flag{font-size:72px;margin-bottom:16px;animation:float 3s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    .hero-title{font-family:'Tiro Bangla',serif;font-size:clamp(64px,13vw,130px);font-weight:400;color:var(--green);line-height:1;margin-bottom:16px;text-shadow:0 0 80px rgba(16,185,129,.45);letter-spacing:-2px}
    .hero-sub{font-size:18px;color:var(--text-dim);margin-bottom:32px;font-weight:300}
    .npm-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 24px;font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--green);margin-bottom:40px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:10px}
    .npm-box:hover{border-color:var(--green);background:rgba(16,185,129,.1)}
    .hero-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
    .btn-primary{background:var(--green);color:#000;border:none;border-radius:10px;padding:14px 36px;font-size:18px;font-family:'Hind Siliguri',sans-serif;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block}
    .btn-primary:hover{background:#34d399;transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,185,129,.35)}
    .btn-secondary{background:transparent;color:var(--green);border:2px solid var(--green);border-radius:10px;padding:14px 36px;font-size:18px;font-family:'Hind Siliguri',sans-serif;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block}
    .btn-secondary:hover{background:rgba(16,185,129,.1);transform:translateY(-2px)}

    /* PLAYGROUND */
    #playground{display:flex;flex-direction:column;border-top:1px solid var(--border)}
    .pg-header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    .pg-title{font-size:15px;font-weight:600;color:var(--green)}
    .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .run-btn{background:var(--green);color:#000;border:none;border-radius:8px;padding:8px 20px;font-size:15px;font-family:'Hind Siliguri',sans-serif;font-weight:700;cursor:pointer;transition:all .2s}
    .run-btn:hover{background:#34d399;transform:scale(1.03)}
    .run-btn:active{transform:scale(.97)}
    .clear-btn{background:transparent;color:var(--text-dim);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;font-family:'Hind Siliguri',sans-serif;cursor:pointer;transition:all .2s}
    .clear-btn:hover{border-color:var(--text-dim);color:var(--text)}
    .ex-btns{display:flex;gap:6px;flex-wrap:wrap}
    .ex-btn{background:var(--surface2);color:var(--blue);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:13px;font-family:'Hind Siliguri',sans-serif;cursor:pointer;transition:all .2s}
    .ex-btn:hover{background:var(--border);color:var(--text)}
    .editor-area{display:flex;min-height:560px}
    .editor-pane{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border)}
    .pane-label{background:var(--surface2);border-bottom:1px solid var(--border);padding:6px 16px;font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:8px}
    .dot{width:8px;height:8px;border-radius:50%}
    #editor{flex:1;background:#0d1117;color:var(--text);border:none;outline:none;resize:none;padding:20px;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.8;min-height:560px}
    .output-pane{width:42%;display:flex;flex-direction:column}
    #output{flex:1;background:#0d1117;padding:20px;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.8;overflow-y:auto;white-space:pre-wrap;min-height:560px}
    .out-line{color:var(--text)}.out-error{color:var(--red)}.out-success{color:var(--green)}.out-empty{color:var(--text-dim);font-style:italic}
    .kw-panel{width:175px;border-left:1px solid var(--border);overflow-y:auto;max-height:560px}
    .kw-title{background:var(--surface2);border-bottom:1px solid var(--border);padding:6px 12px;font-size:12px;color:var(--text-dim);position:sticky;top:0}
    .kw-list{padding:6px}
    .kw-item{display:flex;justify-content:space-between;padding:5px 8px;border-radius:4px;cursor:pointer;transition:background .15s}
    .kw-item:hover{background:var(--surface2)}
    .kw-b{font-size:13px;color:var(--green);font-weight:600}
    .kw-e{font-size:11px;color:var(--text-dim)}

    /* FOOTER */
    footer{background:var(--surface);border-top:1px solid var(--border);padding:48px 24px;text-align:center}
    .ft-title{font-family:'Tiro Bangla',serif;font-size:32px;color:var(--green);margin-bottom:10px}
    .ft-dev{color:var(--text-dim);font-size:15px;margin-bottom:24px}
    .ft-dev a{color:var(--green);text-decoration:none;font-weight:700}
    .ft-links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
    .ft-links a{color:var(--text-dim);text-decoration:none;font-size:14px;transition:color .2s;border:1px solid var(--border);border-radius:6px;padding:7px 16px}
    .ft-links a:hover{color:var(--green);border-color:var(--green)}
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:10px 20px;border-radius:8px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
    .toast.show{opacity:1}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  </style>
</head>
<body>

<section class="hero">
  <div class="hero-flag">🇧🇩</div>
  <h1 class="hero-title">বাংলা-ল্যাং</h1>
  <p class="hero-sub">বাংলা ভাষায় লেখা একটি toy programming language</p>
  <div class="npm-box" onclick="copyNpm()">
    <span>npm i -g bangla-lang-by-tanzid</span>
    <span style="font-size:14px;color:var(--text-dim)">📋</span>
  </div>
  <div class="hero-btns">
    <a href="#playground" class="btn-primary">▶ Playground</a>
    <a href="https://github.com/tanzid-48/bangla-lang" target="_blank" class="btn-secondary">GitHub</a>
  </div>
</section>

<section id="playground">
  <div class="pg-header">
    <span class="pg-title">🖥️ Playground</span>
    <div class="toolbar">
      <button class="run-btn" onclick="runCode()">▶ চালাও</button>
      <button class="clear-btn" onclick="clearOut()">মুছো</button>
      <div class="ex-btns">
        <button class="ex-btn" onclick="load('hello')">Hello</button>
        <button class="ex-btn" onclick="load('loop')">Loop</button>
        <button class="ex-btn" onclick="load('fn')">Function</button>
        <button class="ex-btn" onclick="load('arr')">Array</button>
        <button class="ex-btn" onclick="load('cond')">Condition</button>
      </div>
    </div>
  </div>
  <div class="editor-area">
    <div class="editor-pane">
      <div class="pane-label"><span class="dot" style="background:var(--green)"></span>program.bangla</div>
      <textarea id="editor" spellcheck="false"></textarea>
    </div>
    <div class="output-pane">
      <div class="pane-label"><span class="dot" style="background:var(--blue)"></span>আউটপুট</div>
      <div id="output"><span class="out-empty">// এখানে output দেখাবে</span></div>
    </div>
    <div class="kw-panel">
      <div class="kw-title">📖 Keywords</div>
      <div class="kw-list" id="kwList"></div>
    </div>
  </div>
</section>

<footer>
  <div class="ft-title">বাংলা-ল্যাং 🇧🇩</div>
  <p class="ft-dev">Developed by <a href="https://github.com/tanzid-48" target="_blank">Tanzid Mondol</a></p>
  <div class="ft-links">
    <a href="https://github.com/tanzid-48/bangla-lang" target="_blank">⭐ GitHub</a>
    <a href="https://www.npmjs.com/package/bangla-lang-by-tanzid" target="_blank">📦 npm</a>
    <a href="https://github.com/tanzid-48/bangla-lang/blob/main/README.md" target="_blank">📖 Docs</a>
  </div>
</footer>

<div class="toast" id="toast">✓ Copied!</div>

<script>
const KW=[['শুরু','start'],['শেষ','end'],['ধরো','variable'],['দেখাও','print'],['যদি','if'],['নাহলে','else'],['যতক্ষণ','while'],['গণনা করো','for'],['কাজ','function'],['করো','call'],['ফেরত দাও','return'],['থামো','break'],['এগিয়ে যাও','continue'],['সমস্যা','error'],['সত্য','true'],['মিথ্যা','false'],['শূন্য','null']];
const kl=document.getElementById('kwList');
KW.forEach(([b,e])=>{const d=document.createElement('div');d.className='kw-item';d.innerHTML=`<span class="kw-b">${b}</span><span class="kw-e">${e}</span>`;d.onclick=()=>{const ed=document.getElementById('editor');const s=ed.selectionStart;ed.value=ed.value.slice(0,s)+b+ed.value.slice(s);ed.focus();ed.selectionStart=ed.selectionEnd=s+b.length};kl.appendChild(d)});

const EX={
hello:`// হ্যালো বাংলাদেশ!
শুরু

দেখাও "হ্যালো বাংলাদেশ! 🇧🇩";
দেখাও "বাংলায় কোড লেখা শুরু!";

শেষ`,
loop:`// Loop উদাহরণ
শুরু

গণনা করো (ধরো ক = 1; ক <= 5; ক = ক + 1) {
  দেখাও ক;
}

শেষ`,
fn:`// Function উদাহরণ
শুরু

কাজ যোগ(ক, খ) {
  ফেরত দাও ক + খ;
}

ধরো ফল = যোগ(15, 25);
দেখাও "যোগফল: " + ফল;

শেষ`,
arr:`// Array উদাহরণ
শুরু

ধরো সংখ্যা = [10, 20, 30, 40, 50];
দেখাও সংখ্যা;
দেখাও "প্রথম: " + সংখ্যা[0];

শেষ`,
cond:`// Condition উদাহরণ
শুরু

ধরো নম্বর = 75;
যদি (নম্বর >= 80) {
  দেখাও "A+";
} নাহলে {
  যদি (নম্বর >= 70) {
    দেখাও "A";
  } নাহলে {
    দেখাও "B";
  }
}

শেষ`};

function load(n){document.getElementById('editor').value=EX[n];clearOut();}
document.getElementById('editor').value=EX.hello;

const KEYWORDS={'শুরু':'TOKEN_START','শেষ':'TOKEN_END','ধরো':'TOKEN_VAR','দেখাও':'TOKEN_PRINT','যদি':'TOKEN_IF','নাহলে':'TOKEN_ELSE','যতক্ষণ':'TOKEN_WHILE','থামো':'TOKEN_BREAK','এগিয়ে যাও':'TOKEN_CONTINUE','কাজ':'TOKEN_FUNCTION','করো':'TOKEN_CALL','ফেরত দাও':'TOKEN_RETURN','গণনা করো':'TOKEN_FOR','সমস্যা':'TOKEN_ERROR','সত্য':'TOKEN_TRUE','মিথ্যা':'TOKEN_FALSE','শূন্য':'TOKEN_NULL'};

function tokenize(code){
  const tokens=[];let i=0;
  while(i<code.length){
    if(/\s/.test(code[i])){i++;continue;}
    if(code[i]==='/'&&code[i+1]==='/'){while(i<code.length&&code[i]!=='\n')i++;continue;}
    if(code[i]==='"'){let s='';i++;while(i<code.length&&code[i]!=='"')s+=code[i++];i++;tokens.push({type:'TOKEN_STRING',value:s});continue;}
    if(/[0-9]/.test(code[i])){let n='';while(i<code.length&&/[0-9.]/.test(code[i]))n+=code[i++];tokens.push({type:'TOKEN_NUMBER',value:n});continue;}
    if(code[i]==='='&&code[i+1]==='='){tokens.push({type:'TOKEN_EQ',value:'=='});i+=2;continue;}
    if(code[i]==='!'&&code[i+1]==='='){tokens.push({type:'TOKEN_NEQ',value:'!='});i+=2;continue;}
    if(code[i]==='<'&&code[i+1]==='='){tokens.push({type:'TOKEN_LTE',value:'<='});i+=2;continue;}
    if(code[i]==='>'&&code[i+1]==='='){tokens.push({type:'TOKEN_GTE',value:'>='});i+=2;continue;}
    const sm={'=':'TOKEN_ASSIGN','+':'TOKEN_PLUS','-':'TOKEN_MINUS','*':'TOKEN_MULTIPLY','/':'TOKEN_DIVIDE','%':'TOKEN_MOD','(':'TOKEN_LPAREN',')':'TOKEN_RPAREN','{':'TOKEN_LBRACE','}':'TOKEN_RBRACE',';':'TOKEN_SEMICOLON','<':'TOKEN_LT','>':'TOKEN_GT',',':'TOKEN_COMMA','[':'TOKEN_LBRACKET',']':'TOKEN_RBRACKET'};
    if(sm[code[i]]){tokens.push({type:sm[code[i]],value:code[i]});i++;continue;}
    let w='';while(i<code.length&&!/[\s=+\-*\/%(){};><"0-9,\[\]]/.test(code[i]))w+=code[i++];
    if(!w){i++;continue;}
    const rest=code.slice(i);
    const t3=rest.match(/^\s+(\S+)\s+(\S+)/);if(t3){const tw=w+' '+t3[1]+' '+t3[2];if(KEYWORDS[tw]){tokens.push({type:KEYWORDS[tw],value:tw});i+=t3[0].length;continue;}}
    const t2=rest.match(/^\s+(\S+)/);if(t2){const tw=w+' '+t2[1];if(KEYWORDS[tw]){tokens.push({type:KEYWORDS[tw],value:tw});i+=t2[0].length;continue;}}
    tokens.push({type:KEYWORDS[w]||'TOKEN_IDENTIFIER',value:w});
  }
  tokens.push({type:'TOKEN_EOF',value:''});return tokens;
}

function interpret(tokens,printFn){
  let pos=0;const vars={};const fns={};
  const peek=()=>tokens[pos];const consume=()=>tokens[pos++];
  function expect(t){const x=consume();if(x.type!==t)throw new Error(`Syntax error: "${t}" expected, got "${x.value}"`);return x;}
  function parseExpr(){let l=parsePrimary();const ops=['TOKEN_PLUS','TOKEN_MINUS','TOKEN_MULTIPLY','TOKEN_DIVIDE','TOKEN_MOD','TOKEN_EQ','TOKEN_NEQ','TOKEN_LT','TOKEN_GT','TOKEN_LTE','TOKEN_GTE'];while(ops.includes(peek().type)){const op=consume().value;const r=parsePrimary();if(op==='+')l=typeof l==='string'?l+String(r):l+r;else if(op==='-')l=l-r;else if(op==='*')l=l*r;else if(op==='/')l=l/r;else if(op==='%')l=l%r;else if(op==='==')l=l===r;else if(op==='!=')l=l!==r;else if(op==='<')l=l<r;else if(op==='>')l=l>r;else if(op==='<=')l=l<=r;else if(op==='>=')l=l>=r;}return l;}
  function parsePrimary(){const t=consume();if(t.type==='TOKEN_NUMBER')return parseFloat(t.value);if(t.type==='TOKEN_STRING')return t.value;if(t.type==='TOKEN_TRUE')return true;if(t.type==='TOKEN_FALSE')return false;if(t.type==='TOKEN_NULL')return null;if(t.type==='TOKEN_LBRACKET'){const a=[];while(peek().type!=='TOKEN_RBRACKET'&&peek().type!=='TOKEN_EOF'){a.push(parseExpr());if(peek().type==='TOKEN_COMMA')consume();}expect('TOKEN_RBRACKET');return a;}if(t.type==='TOKEN_IDENTIFIER'){if(peek().type==='TOKEN_LPAREN'){consume();const a=[];while(peek().type!=='TOKEN_RPAREN'&&peek().type!=='TOKEN_EOF'){a.push(parseExpr());if(peek().type==='TOKEN_COMMA')consume();}expect('TOKEN_RPAREN');return callFn(t.value,a);}if(peek().type==='TOKEN_LBRACKET'){consume();const idx=parseExpr();expect('TOKEN_RBRACKET');const a=vars[t.value];if(!Array.isArray(a))throw new Error(`"${t.value}" তালিকা নয়`);return a[idx];}return vars[t.value]??0;}if(t.type==='TOKEN_LPAREN'){const v=parseExpr();expect('TOKEN_RPAREN');return v;}throw new Error(`Unexpected: "${t.value}"`);}
  function callFn(name,args){const fn=fns[name];if(!fn)throw new Error(`"${name}" নামে কোনো কাজ নেই`);const sv={...vars},sp=pos;fn.params.forEach((p,i)=>{vars[p]=args[i]??null;});let res=null;pos=fn.bodyPos;try{runBlock();}catch(e){if(e&&e.type==='RETURN')res=e.value;else throw e;}pos=sp;Object.keys(vars).forEach(k=>delete vars[k]);Object.assign(vars,sv);return res;}
  function skipBlock(){let d=1;while(d>0){const t=consume();if(t.type==='TOKEN_LBRACE')d++;if(t.type==='TOKEN_RBRACE')d--;}}
  function runBlock(){while(peek().type!=='TOKEN_RBRACE'&&peek().type!=='TOKEN_EOF')runStatement();}
  function runStatement(){
    const t=peek();
    if(t.type==='TOKEN_VAR'){consume();const n=expect('TOKEN_IDENTIFIER').value;expect('TOKEN_ASSIGN');vars[n]=parseExpr();expect('TOKEN_SEMICOLON');}
    else if(t.type==='TOKEN_PRINT'){consume();const v=parseExpr();printFn(Array.isArray(v)?JSON.stringify(v):String(v));expect('TOKEN_SEMICOLON');}
    else if(t.type==='TOKEN_ERROR'){consume();const m=parseExpr();throw new Error(`সমস্যা: ${m}`);}
    else if(t.type==='TOKEN_RETURN'){consume();const v=parseExpr();expect('TOKEN_SEMICOLON');throw{type:'RETURN',value:v};}
    else if(t.type==='TOKEN_IF'){consume();expect('TOKEN_LPAREN');const c=parseExpr();expect('TOKEN_RPAREN');expect('TOKEN_LBRACE');if(c){runBlock();expect('TOKEN_RBRACE');}else skipBlock();if(peek().type==='TOKEN_ELSE'){consume();expect('TOKEN_LBRACE');if(!c){runBlock();expect('TOKEN_RBRACE');}else skipBlock();}}
    else if(t.type==='TOKEN_WHILE'){consume();const cp=pos;expect('TOKEN_LPAREN');let c=parseExpr();expect('TOKEN_RPAREN');expect('TOKEN_LBRACE');const bp=pos;while(c){pos=bp;runBlock();pos=cp;expect('TOKEN_LPAREN');c=parseExpr();expect('TOKEN_RPAREN');expect('TOKEN_LBRACE');}skipBlock();}
    else if(t.type==='TOKEN_FOR'){consume();expect('TOKEN_LPAREN');if(peek().type==='TOKEN_VAR')consume();const iN=expect('TOKEN_IDENTIFIER').value;expect('TOKEN_ASSIGN');vars[iN]=parseExpr();expect('TOKEN_SEMICOLON');const cp=pos;parseExpr();expect('TOKEN_SEMICOLON');const uN=expect('TOKEN_IDENTIFIER').value;expect('TOKEN_ASSIGN');const up=pos;let d=0;while(true){const tt=peek();if(tt.type==='TOKEN_EOF')break;if(tt.type==='TOKEN_LPAREN'){d++;consume();continue;}if(tt.type==='TOKEN_RPAREN'){if(d===0)break;d--;consume();continue;}consume();}expect('TOKEN_RPAREN');expect('TOKEN_LBRACE');const bp=pos;pos=cp;let c=parseExpr();expect('TOKEN_SEMICOLON');while(c){pos=bp;runBlock();pos=up;vars[uN]=parseExpr();pos=cp;c=parseExpr();expect('TOKEN_SEMICOLON');}pos=bp;skipBlock();}
    else if(t.type==='TOKEN_FUNCTION'){consume();const n=expect('TOKEN_IDENTIFIER').value;expect('TOKEN_LPAREN');const p=[];while(peek().type!=='TOKEN_RPAREN'&&peek().type!=='TOKEN_EOF'){p.push(expect('TOKEN_IDENTIFIER').value);if(peek().type==='TOKEN_COMMA')consume();}expect('TOKEN_RPAREN');expect('TOKEN_LBRACE');fns[n]={params:p,bodyPos:pos};skipBlock();}
    else if(t.type==='TOKEN_CALL'){consume();const n=expect('TOKEN_IDENTIFIER').value;expect('TOKEN_LPAREN');const a=[];while(peek().type!=='TOKEN_RPAREN'&&peek().type!=='TOKEN_EOF'){a.push(parseExpr());if(peek().type==='TOKEN_COMMA')consume();}expect('TOKEN_RPAREN');expect('TOKEN_SEMICOLON');callFn(n,a);}
    else consume();
  }
  expect('TOKEN_START');while(peek().type!=='TOKEN_END'&&peek().type!=='TOKEN_EOF')runStatement();
}

function runCode(){
  const code=document.getElementById('editor').value;
  const out=document.getElementById('output');out.innerHTML='';
  try{const tokens=tokenize(code);const lines=[];interpret(tokens,l=>lines.push(l));
    if(lines.length===0)out.innerHTML='<span class="out-success">✓ প্রোগ্রাম সফলভাবে চলেছে</span>';
    else out.innerHTML=lines.map(l=>`<span class="out-line">${esc(String(l))}</span>`).join('\n');
  }catch(e){out.innerHTML=`<span class="out-error">❌ ${esc(e.message)}</span>`;}
}

function clearOut(){document.getElementById('output').innerHTML='<span class="out-empty">// এখানে output দেখাবে</span>';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyNpm(){navigator.clipboard.writeText('npm i -g bangla-lang-by-tanzid');const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
document.getElementById('editor').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')runCode();});
</script>
